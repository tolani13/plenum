[workspace]
resolver = "2"
members = ["crates/domain", "crates/api", "crates/seed"]

[workspace.package]
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
domain = { path = "crates/domain" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate",
    "rust_decimal",
    "macros",
] }
tower-sessions = "0.14"
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
dotenvy = "0.15"
# P4 (pre-authorized by the unit constraints):
# reqwest — the spec-§7-named HTTP client for the ONE backend Anthropic call
# (deferred here from P1). MIT/Apache-2.0. No default features: rustls only
# (no native-tls/openssl), json only — the smallest client that can speak the
# vendor API.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# sqlparser (sqlparser-rs) — real AST validation for Ask PLENUM instead of
# regex theater. Apache-2.0. The visitor feature drives the whitelist walk
# (every relation reference, in any clause, at any depth).
sqlparser = { version = "0.62", features = ["visitor"] }
# Deploy unit (pre-authorized, the ONE permitted addition): tower-http (MIT),
# `fs` feature only — ServeDir/ServeFile so the release container serves the
# built SPA from the same origin as /api/* (no CORS, cookies unchanged). The
# standard axum static-serve path; mounted env-gated, dev untouched.
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
