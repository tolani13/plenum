[package]
name = "api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
domain = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
tower-sessions = { workspace = true }
argon2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
dotenvy = { workspace = true }
# P4 AI layer (pre-authorized): the vendor HTTP client (named ONLY inside
# src/ai/client.rs) and the SQL AST validator for Ask PLENUM.
reqwest = { workspace = true }
sqlparser = { workspace = true }
# Deploy unit (pre-authorized): static SPA serving in the release container.
tower-http = { workspace = true }

[dev-dependencies]
# Test-only, axum-ecosystem crates already in the dependency tree transitively:
# tower's `util` feature provides ServiceExt::oneshot for driving the router
# in-process; http-body-util collects response bodies.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
